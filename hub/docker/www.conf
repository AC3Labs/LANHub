[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Sized conservatively for a 2-core, ~4GB machine also running Docker/Portainer.
; Each worker is typically 20-40MB for this app, so 6 max stays well within budget
; while still giving real concurrency instead of the single-threaded dev server.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = no
