<title>LANHub — setup needed</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #f5f4f2; color: #2c2925; max-width: 640px; margin: 64px auto; padding: 0 24px; line-height: 1.6; }

<body>
  <h1>LANHub hit a problem starting up</h1>
  <p>The container is up, but something failed during startup (most likely a database
  migration error). Check the container's logs for the real error:</p>
  <pre>docker compose logs hub</pre>
  <p>Once it's fixed, restart the container:</p>
  <pre>docker compose up -d</pre>
</body>
