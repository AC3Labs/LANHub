; Without this, PHP recompiles every source file from scratch on every
; single request — negligible on a fast NVMe/CPU dev machine, but the
; single biggest cause of "the same app feels unusable" on slower
; hardware. validate_timestamps=0 is safe here specifically because this
; image is immutable per build (code never changes on disk inside a
; running container) and the cache lives in that one process's memory —
; a fresh container always starts with a cold, correct cache.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
