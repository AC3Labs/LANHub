name: Publish hub images

# Builds and publishes LANHub's two images to GitHub Container Registry on
# every push to main that touches gohub/. This is what makes the root
# docker-compose.yml deployable on any docker-compose-driven platform
# (Dokploy, Portainer, Coolify, plain `docker compose up`) without the repo
# checked out: it just pulls them.
#
#   ghcr.io/ac3labs/lanhub:hub    the hub
#   ghcr.io/ac3labs/lanhub:media  LANHub Media (video previews)
#
# Both live in the existing public `lanhub` package. `:latest` is left as the
# last 0.9 (PHP) image on purpose: 0.9 installs pull `:latest` with a volume
# at a different path, and silently swapping the hub under them would look
# like lost data. They move over with the README's "Upgrading from 0.9" steps.

on:
  push:
    branches: [main]
    paths:
      - 'gohub/**'
      - '.github/workflows/publish-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the release version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./gohub
          file: ./gohub/Dockerfile
          build-args: |
            LANHUB_VERSION=${{ steps.version.outputs.version }}
            LANHUB_REVISION=${{ github.sha }}
          push: true
          # Hardcoded lowercase: GHCR image names must be lowercase, and
          # ${{ github.repository_owner }} would resolve to "AC3Labs".
          tags: |
            ghcr.io/ac3labs/lanhub:hub
            ghcr.io/ac3labs/lanhub:hub-${{ github.sha }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

      - uses: docker/build-push-action@v6
        with:
          context: ./gohub
          file: ./gohub/Dockerfile.media
          build-args: |
            LANHUB_VERSION=${{ steps.version.outputs.version }}
            LANHUB_REVISION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/ac3labs/lanhub:media
            ghcr.io/ac3labs/lanhub:media-${{ github.sha }}
          cache-from: type=gha,scope=media
          cache-to: type=gha,mode=max,scope=media
