{{define "content"}}
<p class="text-sm text-stone-500 mb-4">Set a password for {{.Data.Email}} to activate your account.</p>
<form method="post" action="/set-password/{{.Data.Token}}">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <div>
        <label for="password" class="block font-medium text-sm text-stone-700">Password</label>
        <input id="password" name="password" class="border-stone-300 text-stone-800 focus:border-tan-400 focus:ring-tan-400 rounded-md shadow-sm block mt-1 w-full" type="password" required autofocus autocomplete="new-password">
        {{template "fielderror" .Data.Error}}
    </div>
    <div class="mt-4">
        <label for="password_confirmation" class="block font-medium text-sm text-stone-700">Confirm password</label>
        <input id="password_confirmation" name="password_confirmation" class="border-stone-300 text-stone-800 focus:border-tan-400 focus:ring-tan-400 rounded-md shadow-sm block mt-1 w-full" type="password" required autocomplete="new-password">
    </div>
    <div class="flex items-center justify-end mt-4">
        <button type="submit" class="inline-flex items-center px-4 py-2 bg-tan-500 border border-transparent rounded-md font-semibold text-xs text-black uppercase tracking-widest hover:bg-tan-600 focus:bg-tan-600 active:bg-tan-700 focus:outline-none focus:ring-2 focus:ring-tan-400 focus:ring-offset-2 transition ease-in-out duration-150">Set password</button>
    </div>
</form>
{{end}}
