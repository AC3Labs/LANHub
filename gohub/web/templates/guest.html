<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.AppName}}</title>
    {{template "head" .}}
</head>
<body class="font-sans text-stone-800 antialiased">
    <div class="min-h-screen flex flex-col items-center pt-6 sm:pt-0 bg-stone-100">
        <div class="flex-1 flex flex-col items-center justify-center">
            <div>
                <a href="/"><img src="/static/logo.png" alt="LANHub" class="h-16 w-auto"></a>
            </div>
            <div class="w-full sm:max-w-md mt-6 px-6 py-4 bg-paper shadow-panel overflow-hidden sm:rounded-lg border border-stone-200">
                {{if .Flash}}<div class="mb-4 font-medium text-sm text-green-600">{{.Flash}}</div>{{end}}
                {{template "content" .}}
            </div>
        </div>
        {{template "footer" .}}
    </div>
</body>
</html>
