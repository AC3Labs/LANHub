<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{.CSRF}}">
    <title>{{.Title}} · {{.AppName}}</title>
    {{template "head" .}}
</head>
<body class="font-sans antialiased text-stone-800">
    <div class="min-h-screen flex flex-col bg-stone-100">
        {{template "nav" .}}
        {{if .Flash}}
            <div class="bg-tan-50 border-b border-tan-200 text-tan-800 text-sm">
                <div class="max-w-7xl mx-auto py-2.5 px-4 sm:px-6 lg:px-8">{{.Flash}}</div>
            </div>
        {{end}}
        {{if .UpdateVersion}}
            <div class="bg-tan-50 border-b border-tan-200 text-tan-800 text-sm">
                <div class="max-w-7xl mx-auto py-2.5 px-4 sm:px-6 lg:px-8 flex flex-wrap items-center gap-x-4 gap-y-2">
                    <span><b>LANHub {{.UpdateVersion}}</b> is available. This hub runs {{.Version}}.</span>
                    <form method="post" action="/settings/updates/install" onsubmit="return confirm('Update LANHub to {{.UpdateVersion}} now? The hub restarts, which takes about ten seconds, and any transfers in progress are interrupted.')">
                        <input type="hidden" name="_token" value="{{.CSRF}}"><input type="hidden" name="version" value="{{.UpdateVersion}}">
                        <button class="px-3 py-1 rounded-md bg-tan-500 hover:bg-tan-600 text-black text-xs font-semibold">Update now</button>
                    </form>
                    <a href="/settings?tab=updates" class="underline hover:text-stone-800">What's new</a>
                </div>
            </div>
        {{end}}
        <main class="flex-1">
            {{template "content" .}}
        </main>
        {{template "transfers" .}}
        {{template "footer" .}}
    </div>
</body>
</html>
