{{define "content"}}
<form method="post" action="/login">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <div>
        <label for="email" class="block font-medium text-sm text-stone-700">Email</label>
        <input id="email" class="border-stone-300 text-stone-800 focus:border-tan-400 focus:ring-tan-400 rounded-md shadow-sm block mt-1 w-full" type="email" name="email" value="{{.Data.Email}}" required autofocus autocomplete="username">
        {{template "fielderror" .Data.Error}}
    </div>
    <div class="mt-4">
        <label for="password" class="block font-medium text-sm text-stone-700">Password</label>
        <input id="password" class="border-stone-300 text-stone-800 focus:border-tan-400 focus:ring-tan-400 rounded-md shadow-sm block mt-1 w-full" type="password" name="password" required autocomplete="current-password">
    </div>
    <div class="block mt-4">
        <label for="remember" class="inline-flex items-center">
            <input id="remember" type="checkbox" name="remember" value="1" {{if .Data.Remember}}checked{{end}} class="rounded border-stone-300 text-tan-500 focus:ring-tan-400">
            <span class="ms-2 text-sm text-stone-500">Remember me</span>
        </label>
    </div>
    <div class="flex items-center justify-end mt-4">
        <a class="underline text-sm text-stone-500 hover:text-stone-800" href="/forgot-password">Forgot your password?</a>
        <button type="submit" class="inline-flex items-center px-4 py-2 bg-tan-500 border border-transparent rounded-md font-semibold text-xs text-black uppercase tracking-widest hover:bg-tan-600 focus:bg-tan-600 active:bg-tan-700 focus:outline-none focus:ring-2 focus:ring-tan-400 focus:ring-offset-2 transition ease-in-out duration-150 ms-3">Log in</button>
    </div>
</form>
{{end}}
