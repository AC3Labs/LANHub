{{define "content"}}
<div class="mb-4 text-sm text-stone-500">Forgot your password? Enter your email address and we'll email you a link to choose a new one.</div>
<form method="post" action="/forgot-password">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <label class="block font-medium text-sm text-stone-700" for="email">Email</label>
    <input id="email" name="email" type="email" required autofocus class="border-stone-300 text-stone-800 focus:border-tan-400 focus:ring-tan-400 rounded-md shadow-sm block mt-1 w-full">
    <div class="flex items-center justify-between mt-4">
        <a href="/login" class="underline text-sm text-stone-500 hover:text-stone-800">Back to log in</a>
        <button class="inline-flex items-center px-4 py-2 bg-tan-500 border border-transparent rounded-md font-semibold text-xs text-black uppercase tracking-widest hover:bg-tan-600 focus:outline-none focus:ring-2 focus:ring-tan-400 focus:ring-offset-2 transition ease-in-out duration-150">Email Password Reset Link</button>
    </div>
</form>
{{end}}
