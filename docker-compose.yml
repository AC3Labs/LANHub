services:
  hub:
    # Prebuilt and published by .github/workflows/publish-image.yml on
    # every push to main — this file works standalone, on any
    # docker-compose-driven platform (Dokploy, Portainer, Coolify, plain
    # `docker compose up`), with no repo checkout and no separate .env
    # file needed. If you're working from a full clone and want to build
    # your own image instead (e.g. testing a local change), swap this
    # line for `build: ./hub`.
    image: ghcr.io/ac3labs/lanhub:latest
    restart: unless-stopped

    # Nothing in this file needs editing. Start it, then open
    # http://<this-server's-IP>:8949 in a browser.
    ports:
      # If 8949 is already used by something else on your server, change
      # only the left-hand number (e.g. "8950:8000") and open that port
      # instead. Using Dokploy/Coolify with a domain? You can delete these
      # two lines and point the domain at port 8000 instead.
      - "8949:8000"

    environment:
      # Nothing here needs changing. LANHub works out its own address from
      # how you reach it (IP, hostname, port, or a domain through a reverse
      # proxy). The commented-out lines are optional extras.

      # Pin the address used in links inside emails (invites, password
      # resets). Normally not needed: it's recorded automatically during
      # first-run setup and can be changed later on the Settings page.
      # APP_URL: https://lanhub.example.com

      # Pin a specific encryption key. If left out, one is generated on
      # first start and saved in the hub_db volume, so it survives restarts
      # and updates. Only set this to move an existing database to a new
      # container from scratch.
      # APP_KEY: "base64:..."

      # The port LANHub listens on inside the container. Leave it alone —
      # to change the port you browse to, change the left-hand number
      # under `ports:` above instead. (Only platforms that route to a
      # specific container-internal port ever need this changed.)
      PORT: "8000"

    volumes:
      # The only thing that needs to persist — your database (and the
      # auto-generated APP_KEY above, if you didn't set your own).
      # Deliberately NOT the whole database/ directory — that would hide
      # the image's own database/migrations/ folder on every update and
      # new migrations would silently never run.
      - hub_db:/var/www/html/storage/db

volumes:
  hub_db:
